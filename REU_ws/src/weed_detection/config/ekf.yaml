# Jonathan Freed
# EKF filter configuration file


#----- Local filter (IMU + Wheel Odometry) -> odom frame -------------------------
ekf_filter_node_odom:
  ros__parameters:

    frequency: 30.0 #frequency in hz of position estimate output
    sensor_timeout: 0.1 #period in seconds in which a sensor will be considered to timeout, carry out predict cycle
    two_d_mode: true 
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_tf: true #broadcast transformation over /tf topic

    # Coordinate Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom #local EKF owns odom->base_link transform

    # Sensor Configs
    #odom: x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az.
    # wheel_odom_node publishes vx, vyaw
    odom0: /odom
    odom0_config: [false,  false,  false,
                  false, false, false,
                  true, false, false,
                  false, false, true,
                  false, false, false]
    odom0_queue_size: 10

    #imu publishes 
    imu0: /imu/data
    imu0_config: [false,  false,  false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    


#----- Global filter (GPS + local odom) -> map frame -------------------------
ekf_filter_node_map:
  ros__parameters:

    frequency: 30.0 #frequency in hz of position estimate output
    sensor_timeout: 0.1 #period in seconds in which a sensor will be considered to timeout, carry out predict cycle
    two_d_mode: true 
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_tf: true #broadcast transformation over /tf topic

    # Coordinate Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map #global EKF owns map->odom transform

    # Sensor Configs
    #[x, y, z], [roll, pitch, yaw], [vx, vy, vz], [vroll, vpitch, vyaw], [ax, ay, az].
    # wheel_odom_node publishes vx, vyaw
    odom0: /odom
    odom0_config: [false,  false,  false,
                  false, false, false,
                  true, false, false,
                  false, false, true,
                  false, false, false]
    odom0_queue_size: 10

    odom1: /odometry/gps
    odom1_config: [true, true, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    odom1_queue_size: 10

    #imu publishes 
    imu0: /imu/data
    imu0_config: [false,  false,  false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10


  #----- Navsat transform -------------------------
  navsat_transform:
    ros__parameters:
      frequency: 30.0
      delay: 3.0
      magnetic_declination_radians: 0.0
      yaw_offset: 0.0
      zero_altitude: true
      broadcast_utm_transform: false
      publish_filtered_gps: true
      use_odometry_yaw: true
      wait_for_datum: false
